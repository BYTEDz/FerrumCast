name: Build FerrumCast

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      windows-artifact:
        description: 'Windows artifact name'
        value: ferrumcast-x86_64-pc-windows-msvc
      linux-artifact:
        description: 'Linux artifact name'
        value: ferrumcast-x86_64-unknown-linux-gnu
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

env:
  GST_VERSION: "1.28.3"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: BYTEDz/FerrumCast
          ref: ${{ github.repository != 'BYTEDz/FerrumCast' && 'main' || github.ref }}
          fetch-depth: 0

      # Rust Toolchain Setup & Cache
      - name: Install Rust (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Rust (Windows MSVC)
        if: startsWith(matrix.os, 'windows')
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Dependency Installation
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libpipewire-0.3-dev libxdo-dev pkg-config

      - name: Cache GStreamer installation (Windows)
        if: startsWith(matrix.os, 'windows')
        id: cache-gst
        uses: actions/cache@v5
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-${{ matrix.target }}-${{ env.GST_VERSION }}

      - name: Install pkg-config (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          choco install -y pkgconfiglite

      - name: Setup Windows GStreamer (MSVC)
        if: startsWith(matrix.os, 'windows') && steps.cache-gst.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $version = "${{ env.GST_VERSION }}"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.exe"
          $gstreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"
          Write-Host "Downloading Unified GStreamer Installer $version..."
          curl.exe -L -o gstreamer-installer.exe $url
          Write-Host "Installing GStreamer to $gstreamerRoot..."
          Start-Process gstreamer-installer.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', '/TYPE=devel', "/DIR=$gstreamerRoot" -NoNewWindow -Wait
          if (-Not (Test-Path $gstreamerRoot)) { throw "GStreamer installation failed" }

      - name: Set GStreamer environment variables (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          $gstreamerRoot = "C:\gstreamer\1.0\msvc_x86_64"
          Add-Content -Path $env:GITHUB_ENV -Value "GSTREAMER_ROOT=$gstreamerRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gstreamerRoot\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "$gstreamerRoot\bin"

      # Build Stage
      - name: Build Binary (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Binary (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging Stage
      - name: Prepare Windows Portable Package
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $zipName = "ferrumcast-$ver-${{ matrix.target }}.zip"
          $dist = Join-Path $PWD dist
          $distPlugins = Join-Path $dist 'gstreamer-1.0'
          $distScannerDir = Join-Path $dist 'libexec\gstreamer-1.0'

          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path $distPlugins | Out-Null

          $gstBin = Join-Path $env:GSTREAMER_ROOT 'bin'
          $gstPlugins = Join-Path $env:GSTREAMER_ROOT 'lib\gstreamer-1.0'

          # 1. Copy main binary
          $exePath = Join-Path "target/${{ matrix.target }}/release" "ferrumcast.exe"
          Copy-Item -Path $exePath -Destination $dist -Force

          # 2. Select required GStreamer streaming plugins
          $essentialPlugins = @(
              'gstapp.dll', 'gstaudioconvert.dll', 'gstaudioresample.dll', 'gstautodetect.dll',
              'gstcoreelements.dll', 'gstd3d11.dll', 'gstmediafoundation.dll', 'gstnvcodec.dll',
              'gstopus.dll', 'gstqsv.dll', 'gstrtp.dll', 'gstsrtp.dll', 'gstudp.dll',
              'gstvideoconvertscale.dll', 'gstvideoconvert.dll', 'gstvideorate.dll',
              'gstvideoscale.dll', 'gstvideoparsersbad.dll', 'gstwasapi.dll', 'gstx264.dll'
          )

          foreach ($plugin in $essentialPlugins) {
              $pSrc = Join-Path $gstPlugins $plugin
              if (Test-Path $pSrc) {
                  Copy-Item -Path $pSrc -Destination $distPlugins -Force
              }
          }

          # 3. Smart Recursive Dependency Finder for runtime DLLs
          function Get-DllDependencies($filePath) {
              $bytes = [System.IO.File]::ReadAllBytes($filePath)
              $text = [System.Text.Encoding]::ASCII.GetString($bytes)
              $matches = [regex]::Matches($text, '(?i)[a-z0-9_\-]+\.dll')
              return $matches.Value | Select-Object -Unique
          }

          $processed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $queue = [System.Collections.Generic.Queue[string]]::new()

          # Enqueue ferrumcast.exe and all copied plugin DLLs as dependency analysis targets
          Get-ChildItem -Path $dist -Recurse -Filter "*.exe" | ForEach-Object { $queue.Enqueue($_.FullName) }
          Get-ChildItem -Path $distPlugins -Filter "*.dll" | ForEach-Object { $queue.Enqueue($_.FullName) }

          while ($queue.Count -gt 0) {
              $targetPath = $queue.Dequeue()
              if ($processed.Contains($targetPath)) { continue }
              $processed.Add($targetPath) | Out-Null

              $deps = Get-DllDependencies -filePath $targetPath
              foreach ($dep in $deps) {
                  $candidateGstDll = Join-Path $gstBin $dep
                  $distDestination = Join-Path $dist $dep

                  if ((Test-Path $candidateGstDll) -and -not (Test-Path $distDestination)) {
                      Write-Host "Smart Finder: Including required dependency $dep (for $(Split-Path $targetPath -Leaf))"
                      Copy-Item -Path $candidateGstDll -Destination $distDestination -Force
                      $queue.Enqueue($distDestination)
                  }
              }
          }

          # 4. Copy gst-plugin-scanner.exe helper
          $scanner = Join-Path $env:GSTREAMER_ROOT 'libexec\gstreamer-1.0\gst-plugin-scanner.exe'
          if (Test-Path $scanner) {
              New-Item -ItemType Directory -Force -Path $distScannerDir | Out-Null
              Copy-Item -Path $scanner -Destination $distScannerDir -Force
          }

          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath (Join-Path $PWD $zipName) -Force
          echo "UPLOAD_TARGET=$zipName" >> $env:GITHUB_ENV

      - name: Prepare Linux Package (.tar.gz)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-v0.1.0}"
          ARCHIVE_NAME="ferrumcast-${VER}-${{ matrix.target }}.tar.gz"
          
          mkdir -p dist_linux
          cp "target/${{ matrix.target }}/release/ferrumcast" dist_linux/ferrumcast
          chmod +x dist_linux/ferrumcast
          
          tar -czf "${ARCHIVE_NAME}" -C dist_linux ferrumcast
          echo "UPLOAD_TARGET=${ARCHIVE_NAME}" >> $GITHUB_ENV

      # Upload Artifacts for Release Job
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.target }}
          path: ${{ env.UPLOAD_TARGET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: build-artifact-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true